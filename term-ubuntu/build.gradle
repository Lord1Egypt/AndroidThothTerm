plugins {
    id 'com.android.application'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

android {
    namespace = "com.thothterm"

    enableKotlin = false

    compileSdk = rootProject.ext.compileSdk
    buildToolsVersion = rootProject.ext.buildToolsVersion
    ndkVersion = rootProject.ext.ndkVersion
    defaultConfig {
        applicationId "com.thothterm.ubuntu"
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion

        vectorDrawables.useSupportLibrary = true

        versionCode 102
        versionName '0.1.2'

        // Drives the real two-finger pinch that only a device can produce.
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // ThothTerm Ubuntu V1 is ARM64 only.
        ndk {
            abiFilters 'arm64-v8a'
        }

        // Debug and release share the application id so the debug APK installs as
        // com.thothterm.ubuntu and can coexist with com.thothterm (terminal edition).
        manifestPlaceholders.applicationIdSuffix = ""
        buildConfigField("String", "APPLICATION_ID_SUFFIX", "\"\"")
        externalNativeBuild {
            cmake {
                arguments "-DAPPLICATION_ID:STRING=${applicationId}"
            }
        }
    }
    lint {
        targetSdk = rootProject.ext.targetSdkVersion
    }
    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    flavorDimensions = ["catalog"]
    productFlavors {
        // Embeds the Ubuntu userland, so first run needs no network.
        full {
            dimension 'catalog'
            buildConfigField("boolean", "EMBEDDED_ROOTFS", "true")
        }
        // Ships no distribution payload: F-Droid's inclusion policy only allows
        // binaries it built itself, and an Ubuntu rootfs is thousands of
        // executables it did not. The userland is fetched on first run, after
        // explicit consent, from the same pinned URL and checksum the full
        // flavour embeds. Everything after extraction is the shared code path.
        fdroid {
            dimension 'catalog'
            buildConfigField("boolean", "EMBEDDED_ROOTFS", "false")
        }
    }
    buildTypes {
        debug {
        }
        release {
            minifyEnabled = false
        }
    }
    buildFeatures {
        aidl = true
        buildConfig = true
    }
    packaging {
        jniLibs {
            // Required so the PRoot runtime and its loader land on disk with the
            // executable bit inside ApplicationInfo.nativeLibraryDir. Guest
            // binaries are never execve'd by PRoot (they are mapped), so they can
            // stay in app-private storage.
            useLegacyPackaging = true
            keepDebugSymbols += ["**/libproot.so", "**/libproot_loader.so"]
        }
    }
}

dependencies {
    implementation project(':emulatorview')
    implementation project(':libtermexec')

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.preference
    implementation libs.annotation

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

// Builds the PRoot runtime from the pinned sources in third_party/. Needed by
// every flavour, and it downloads nothing.
def buildProot = tasks.register('buildProotRuntime', Exec) {
    description = 'Build PRoot, its loader, talloc and libandroid-shmem from source.'
    group = 'build'
    workingDir projectDir
    commandLine 'sh', 'tools/build-proot.sh'
    // Use the NDK this module is already pinned to, so the PRoot runtime and
    // the CMake targets are produced by one toolchain locally and on a build
    // server alike.
    environment 'THOTHTERM_NDK_VERSION', rootProject.ext.ndkVersion
    inputs.dir rootProject.file('third_party/proot')
    inputs.dir rootProject.file('third_party/talloc')
    inputs.dir rootProject.file('third_party/libandroid-shmem')
    inputs.dir file('patches')
    inputs.file file('tools/build-proot.sh')
    outputs.file file('src/main/jniLibs/arm64-v8a/libproot.so')
    outputs.file file('src/main/jniLibs/arm64-v8a/libproot_loader.so')
    outputs.file file('src/main/assets/runtime/arm64-v8a/libtalloc.so.2')
    outputs.file file('src/main/assets/runtime/arm64-v8a/libandroid-shmem.so')
}

// Stages the embedded Ubuntu payload. Only the full flavour packages it.
def prepareUbuntu = tasks.register('prepareUbuntuRuntime', Exec) {
    description = 'Fetch, verify, and stage the pinned Ubuntu rootfs and admin packages.'
    group = 'build'
    workingDir projectDir
    commandLine 'sh', 'tools/prepare-assets.sh'
    // The script is cache-aware and exits quickly when the verified artifacts are present.
}

tasks.configureEach { task ->
    if (task.name == 'preBuild') task.dependsOn buildProot
    // Flavour-specific: only "full" variants stage the Ubuntu payload.
    if (task.name ==~ /^pre[Ff]ull.*Build$/) task.dependsOn prepareUbuntu
}
