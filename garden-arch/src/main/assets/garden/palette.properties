# ThothTerm Rolling -- the edition palette for what ThothTerm itself draws: the
# welcome banner, the managed prompt, the terminal's default colours and the
# LAN page's chrome. garden-common maps these roles; programs' own colours are
# never changed.
#
# Source: docs/branding/debian/source/thothterm-debian-branding-sheet.png
# sampled by tools/garden/branding/palette.py --hue-shift -122 --muted-rim 0.70:
# the Garden sheet's own values turned by the same hue rotation that made this
# edition's artwork (tools/garden/branding/recolor.py). docs/branding/arch/PALETTE.md.
# Text roles are drawn with the nearest xterm-256 colour (noted after each).

# Petal blue, the lit face of the petals            -> 69  #5F87FF
primary=#4F7FF4
# Rim glow around the petals                        -> 111 #87AFFF
secondary=#9AADFD
# The sheet's title lettering, turned               -> 68  #5F87D7
highlight=#749BF8
# The emblem's >_ glyph                             -> 255 #EEEEEE
foreground=#F3EDFE
# 70% rim glow over 30% backdrop, for labels        -> 103 #8787AF
muted=#6C7BB6

promptUser=#4F7FF4
promptHost=#9AADFD
promptPath=#F3EDFE

# The sheet's backdrop, and its lifted navy, as full colours.
background=#020811
surface=#061224
