# ThothTerm Rolling -- the Garden edition's data. garden-common reads this file
# and holds no distribution knowledge of its own. The rootfs pin below is the
# output of garden-arch/rootfs/build-rootfs.sh; how it was built and how to
# rebuild it byte for byte: docs/garden/arch/ROOTFS_PROVENANCE.md
editionName=ThothTerm Rolling
distroName=Arch Linux ARM
# Rolling: the archive is the complete, consistent package state at its build
# moment. The welcome banner reads the guest's own /etc/os-release.
distroVersion=AArch64 (packages as of 2026-09-30)
distroDir=arch-aarch64

imageId=arch-aarch64-03a4c669ed6f
architecture=aarch64
# The fdroid flavour downloads exactly this file after explicit consent and
# refuses it unless both the size and the SHA-256 below match. The full
# flavour's build refuses to embed anything else.
sourceUrl=https://github.com/Lord1Egypt/AndroidThothTerm/releases/download/arch-rootfs-aarch64-03a4c669ed6f/thothterm-arch-aarch64-rootfs-03a4c669ed6f.tar.gz
# Embedded as .tgz: the asset packager would expand a *.gz asset.
assetName=thothterm-arch-aarch64-rootfs-03a4c669ed6f.tgz
sha256=03a4c669ed6f89d044a9e83dce54c554f04885fd1bb7d1793f5b95b7cc0f48d1
compressedSize=199826020
uncompressedSize=674723840
# Bumped when the managed guest configuration must be re-applied.
schemaVersion=1

# Ubuntu 7681, Trixie 7682: docs/garden/PORTS.md.
lanPort=7683
sudoBinary=usr/bin/sudo

# pacman, not dpkg: the app creates this installation's own pacman keyring at
# first run (pacman-key --init, --populate) and proves it against the
# distribution's package-signing key before setup completes.
packageManager=pacman
adminGroup=wheel
pacmanKeyring=archlinuxarm
# Arch Linux ARM Build System <builder@archlinuxarm.org>, as published on
# https://archlinuxarm.org/about/package-signing
packageSigningKey=68B3537F39A313B3E574D06777193F152BDBE6A6
