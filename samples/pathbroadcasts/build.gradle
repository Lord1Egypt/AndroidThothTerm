plugins {
    id 'com.android.application'
}
// No Java toolchain is requested on purpose. Each module already fixes the
// Java level it compiles to through compileOptions, so the toolchain only
// chose which JDK ran javac -- and pinning it to 17 made the build
// unsatisfiable on build servers that ship a newer JDK and cannot provision
// an older one. Debian trixie, which F-Droid builds on, carries no JDK 17 at
// all. The build now runs on whatever JDK the environment provides.

// "ThothTerm" applicationId
def termApplicationId = "com.thothterm"

android {
    namespace = "jackpal.androidterm.sample.pathbroadcasts"

    enableKotlin = false

    compileSdk = rootProject.ext.compileSdk
    buildToolsVersion = rootProject.ext.buildToolsVersion
    defaultConfig {
        applicationId "com.thothterm.sample.pathbroadcasts"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode 210
        versionName '2.1.0'

        manifestPlaceholders.applicationIdSuffix = ""
        buildConfigField("String", "APPLICATION_ID_SUFFIX", "\"\"")

        manifestPlaceholders.termApplicationId = "${termApplicationId}"
        buildConfigField("String", "TERM_APPLICATION_ID", "\"${termApplicationId}\"")
    }
    lint {
        targetSdk = rootProject.ext.targetSdkVersion
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    productFlavors {
    }
    buildTypes {
        debug {
            applicationIdSuffix ".devel"

            // NOTE: used in third party development applications
            manifestPlaceholders.applicationIdSuffix = "${applicationIdSuffix}"
            buildConfigField("String", "APPLICATION_ID_SUFFIX", "\"${applicationIdSuffix}\"")
        }
        release {
            minifyEnabled = false
            // use default file with automatically generated optimization rules/R8 optimizer
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
    buildFeatures {
        buildConfig = true
    }
}
