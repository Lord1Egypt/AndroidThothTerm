# ThothTerm Trixie -- the edition palette for what ThothTerm itself draws: the
# welcome banner, the managed prompt, the terminal's default colours and the
# LAN page's chrome. garden-common maps these roles; programs' own colours are
# never changed.
#
# Source: docs/branding/debian/source/thothterm-debian-branding-sheet.png, the
# approved sheet as delivered, sampled by tools/garden/branding/palette.py.
# How each value was taken: docs/branding/debian/PALETTE.md.
# Text roles are drawn with the nearest xterm-256 colour (noted after each).

# Petal pink, the lit face of the petals            -> 204 #FF5F87
primary=#F44F7A
# Rim glow around the petals                        -> 217 #FFAFAF
secondary=#FD9AAA
# The sheet's own "DEBIAN" title lettering          -> 211 #FF87AF
highlight=#F87497
# The cream of the emblem's >_ glyph                -> 255 #EEEEEE
foreground=#FEF4ED
# 62% glyph cream over 38% backdrop, for labels     -> 247 #9E9E9E
muted=#A49896

promptUser=#F44F7A
promptHost=#FD9AAA
promptPath=#FEF4ED

# The sheet's backdrop, and its lifted maroon, as full colours.
background=#110208
surface=#240611
