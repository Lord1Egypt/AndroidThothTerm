# ThothTerm • ThothDock (the Trixie edition with ThothDock) -- the Garden edition's data. garden-common reads this file
# and holds no distribution knowledge of its own. The rootfs pin below is the
# output of garden-debian/rootfs/build-rootfs.sh; how it was built and how to
# rebuild it byte for byte: docs/garden/debian/ROOTFS_PROVENANCE.md
editionName=ThothTerm • ThothDock
distroName=Debian
# Major release and codename only: the point release moves with apt upgrades,
# and the welcome banner reads it from /etc/os-release.
distroVersion=13 (trixie)
distroDir=debian-trixie

imageId=debian-trixie-arm64-f6520ff1c6ee
architecture=aarch64
# The fdroid flavour downloads exactly this file after explicit consent and
# refuses it unless both the size and the SHA-256 below match. The full
# flavour's build refuses to embed anything else.
sourceUrl=https://github.com/Lord1Egypt/AndroidThothTerm/releases/download/debian-rootfs-trixie-arm64-f6520ff1c6ee/thothterm-debian-trixie-arm64-rootfs-f6520ff1c6ee.tar.gz
# Embedded as .tgz: the asset packager would expand a *.gz asset.
assetName=thothterm-debian-trixie-arm64-rootfs-f6520ff1c6ee.tgz
sha256=f6520ff1c6eeb28ead2d175e6733da4c970459a291b1bd60f992f1655c5d0677
compressedSize=62445701
uncompressedSize=176332800
# Bumped when the managed guest configuration must be re-applied.
schemaVersion=1

# ThothTerm Ubuntu listens on 7681; the editions run side by side.
lanPort=7682
# Debian's sudo is a real binary (Ubuntu's is sudo.ws behind an alternative).
sudoBinary=usr/bin/sudo
