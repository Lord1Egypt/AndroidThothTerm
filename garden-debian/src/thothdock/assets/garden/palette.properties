# ThothDock QA palette for what ThothTerm draws inside the terminal: banner,
# managed prompt, default terminal colours. Values are the canonical tokens in
# res/values/thothdock_tokens.xml (tools/garden/branding/check_thothdock_palette.py
# keeps the two in step). Text roles are drawn with the nearest xterm-256
# colour; the terminal's own default colours use the exact hex. Programs' own
# ANSI colours are never changed.

# Cursor and banner mark: the brand cyan
primary=#18E7FF
# Paths, secondary mark rows: the readable blue
secondary=#70AFFF
# Edition name in the banner: bright cyan
highlight=#6CF4FF
# Default terminal text: cool silver-white
foreground=#DCE8EE
# Labels, dim text
muted=#80939F

promptUser=#43E6F5
promptHost=#43E6F5
promptPath=#70AFFF

background=#090D12
surface=#111820
