plugins {
    id 'com.android.application'
}
// No Java toolchain is requested on purpose. Each module already fixes the
// Java level it compiles to through compileOptions, so the toolchain only
// chose which JDK ran javac -- and pinning it to 17 made the build
// unsatisfiable on build servers that ship a newer JDK and cannot provision
// an older one. Debian trixie, which F-Droid builds on, carries no JDK 17 at
// all. The build now runs on whatever JDK the environment provides.

android {
    namespace = "com.thothterm"

    enableKotlin = false

    compileSdk = rootProject.ext.compileSdk
    buildToolsVersion = rootProject.ext.buildToolsVersion
    ndkVersion = rootProject.ext.ndkVersion
    defaultConfig {
        applicationId "com.thothterm"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        vectorDrawables.useSupportLibrary = true

        versionCode 10000
        versionName '1.0.0'

        manifestPlaceholders.applicationIdSuffix = ""
        buildConfigField("String", "APPLICATION_ID_SUFFIX", "\"\"")
        externalNativeBuild {
            cmake {
                arguments "-DAPPLICATION_ID:STRING=${applicationId}"
            }
        }
    }
    lint {
        targetSdk = rootProject.ext.targetSdkVersion
    }
    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    flavorDimensions = ["catalog"]
    productFlavors {
        play {
            // Google Play store
            dimension 'catalog'
        }
        full {
            dimension 'catalog'
        }
    }
    if (project.hasProperty("signing.properties")) {

        Properties properties = new Properties()
        properties.load(new FileInputStream(file(project.property("signing.properties"))))

        signingConfigs {
            release {
                storeFile file(properties["store.file"])
                storePassword properties["store.password"]
                keyAlias properties["key.alias"]
                keyPassword properties["key.password"]
            }
        }

        android.buildTypes.release.signingConfig = signingConfigs.release
    }
    buildTypes {
        debug {
            applicationIdSuffix ".devel"

            // NOTE: used in third party development applications
            manifestPlaceholders.applicationIdSuffix = "${applicationIdSuffix}"
            buildConfigField("String", "APPLICATION_ID_SUFFIX", "\"${applicationIdSuffix}\"")
            externalNativeBuild {
                cmake {
                    arguments "-DAPPLICATION_ID:STRING=${defaultConfig.applicationId}${applicationIdSuffix}"
                }
            }
        }
        release {
            minifyEnabled = false
            // use default file with automatically generated optimization rules/R8 optimizer
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
    buildFeatures {
        aidl = true
        buildConfig = true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation project(':emulatorview')
    implementation project(':libtermexec')

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.preference
    implementation libs.annotation

    testImplementation 'junit:junit:4.13.2'
}

tasks.register('elfcleaner', Exec) {
    // only unix, run elf-cleaner if available on host
    commandLine 'sh', '-c', 'which elf-cleaner >/dev/null 2>&1 && find build/*/stripped* -name lib*.so -print0 | xargs -0 -P 0 elf-cleaner || true'
}

tasks.configureEach { task ->
    if (task.name.matches('strip.*DebugSymbols')) {
        task.finalizedBy elfcleaner
    }
}
