# ThothTerm BlackArch -- the Garden edition's data. garden-common reads this file
# and holds no distribution knowledge of its own.
#
# The rootfs pin below is the candidate built by rootfs/build-rootfs.sh and
# validated on the host (docs/garden/blackarch/ROOTFS_PROVENANCE.md). It is NOT
# PUBLISHED: no release asset exists, so sourceUrl is a name under a reserved,
# never-resolving host, not a download location (rootfsPublication). The full
# flavour stages the verified archive from garden-blackarch/rootfs/out/ and
# refuses anything whose size or SHA-256 differ; no F-Droid release can be
# packaged until the archive is published and rootfsPublication=published.
editionName=ThothTerm BlackArch
distroName=Arch Linux ARM + BlackArch
distroVersion=AArch64 (packages as of 2026-09-30)
distroDir=blackarch-aarch64

imageId=blackarch-aarch64-45a791115213
architecture=aarch64
# Not published: see above. Replace with the immutable GitHub release URL
# (blackarch-rootfs-aarch64-45a791115213) when it exists.
rootfsPublication=not-published
sourceUrl=https://rootfs-not-yet-published.invalid/thothterm-blackarch-aarch64-rootfs-45a791115213.tar.gz
# Embedded as .tgz: the asset packager would expand a *.gz asset.
assetName=thothterm-blackarch-aarch64-rootfs-45a791115213.tgz
sha256=45a79111521382fc4162d5642da360b7a78a1cc251a1e2efcf138bb41bc94ac9
compressedSize=199874013
uncompressedSize=674775040
# Bumped when the managed guest configuration must be re-applied.
schemaVersion=1

# Ubuntu 7681, Trixie 7682, Rolling 7683: docs/garden/PORTS.md.
lanPort=7684
sudoBinary=usr/bin/sudo

# pacman, as in Rolling, with two signing identities: the app creates this
# installation's own pacman keyring at first run and populates both keyrings,
# then proves both keys against genuine signed packages before it reports done.
packageManager=pacman
adminGroup=wheel
pacmanKeyring=archlinuxarm blackarch
# 1. Arch Linux ARM Build System <builder@archlinuxarm.org>, as published on
#    https://archlinuxarm.org/about/package-signing
# 2. Levon 'noptrix' Kayan (BlackArch Developer), who signed blackarch-keyring
#    20251011-2 and the packages sampled on 2026-10-03; one of the four signers
#    in blackarch-keyring's blackarch-trusted (docs/garden/blackarch/DESIGN.md).
packageSigningKey=68B3537F39A313B3E574D06777193F152BDBE6A6 F9A6E68A711354D84A9B91637533BAFE69A25079
