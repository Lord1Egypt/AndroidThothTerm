# ThothTerm BlackArch -- the edition palette for what ThothTerm itself draws: the
# welcome banner, the managed prompt, the terminal's default colours and the
# LAN page's chrome. garden-common maps these roles; programs' own colours are
# never changed.
#
# Source: docs/branding/blackarch/source/thothterm-blackarch-branding-sheet.png
# sampled by tools/garden/branding/palette_metallic.py: silver, steel and graphite
# metal on near-black, with only the sheet's own faint cold tint.
# docs/branding/blackarch/PALETTE.md. Text roles are drawn with the nearest
# xterm-256 colour (noted after each).

# Bright silver: petal edges and highlights        -> 254 #E4E4E4
primary=#DFE4E8
# Gunmetal: halfway between steel and graphite     -> 245 #8A8A8A
secondary=#7E8C98
# The sheet's silver "BLACK" lettering             -> 251 #C6C6C6
highlight=#C3CAD2
# Near-white: the brightest metal                  -> 231 #FFFFFF
foreground=#FBFBFC
# Graphite: 10% steel over graphite, for labels    -> 243 #767676
muted=#6D7D89

promptUser=#DFE4E8
promptHost=#7E8C98
promptPath=#FBFBFC

# The sheet's near-black backdrop, and its lifted graphite.
background=#020406
surface=#080C0F
