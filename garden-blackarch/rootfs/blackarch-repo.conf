
[blackarch]
# ThothTerm BlackArch: BlackArch's own aarch64 repository, over HTTPS. This
# section is the only repository added to Arch Linux ARM's list, and it sets no
# SigLevel of its own: packages stay signature-checked under the global level.
# The blackarch-mirrorlist package is not installed (add its Include here to
# use a mirror). docs/garden/blackarch/ROOTFS_PROVENANCE.md.
Server = https://blackarch.org/blackarch/$repo/os/$arch
