Changelog: https://github.com/Lord1Egypt/AndroidThothTerm/releases

Name: ThothTerm Ubuntu
Summary: A real Ubuntu terminal, no root required

Description: |-
    ThothTerm Ubuntu runs a genuine Ubuntu 26.04 LTS (ARM64) userland on your
    phone and gives you a proper terminal into it. No root, no virtual machine,
    no remote server.

    It is a terminal first. The Ubuntu side is real Ubuntu: apt works, dpkg
    works, sudo is the distribution's own sudo rather than a wrapper, and
    anything you install stays installed. Your home directory survives app
    updates.

    '''First run needs a download.''' This build does not include the Ubuntu
    userland, so the first launch offers to fetch it (about 33 MB) from
    Canonical's cdimage.ubuntu.com. The app explains this before doing anything
    and will not download without your agreement. The archive is checked against
    a SHA-256 built into the app and is refused if it does not match.

    Features:

    * Ubuntu 26.04 LTS ARM64, prepared on first launch
    * Real sudo, apt and dpkg
    * Persistent home directory and root filesystem across app upgrades
    * Multiple terminal sessions with a window list
    * Pinch-to-zoom, plus Zoom in / Zoom out / Reset font size
    * An extra keys row for Esc, Ctrl, Alt, Tab and arrows
    * Portrait and landscape layouts
    * Copy and paste, text selection and scrollback
    * Tools installed under your home directory stay on PATH between sessions

    Requirements: a 64-bit ARM device (arm64-v8a) and roughly 400 MB of free
    space. Other ABIs are not supported.

    ThothTerm is a fork of TermOne Plus, which derives from Terminal Emulator
    for Android and the Android Open Source Project. The PRoot runtime is built
    from source as part of the F-Droid build; see THIRD_PARTY_NOTICES.md for the
    full inventory, pinned revisions and licenses.

RepoType: git
Repo: https://github.com/Lord1Egypt/AndroidThothTerm.git

Builds:
  - versionName: 0.1.0
    versionCode: 100
    commit: ubuntu-v0.1.0
    subdir: term-ubuntu
    submodules: true
    gradle:
      - fdroid
    ndk: r23c

MaintainerNotes: |-
    arm64-v8a only. minSdk 26, targetSdk 36.

    The fdroid flavour packages no distribution binaries: no rootfs archive and
    no .deb payload. tools/prepare-assets.sh, which stages those for the full
    flavour, is wired to preFull*Build only and does not run for this flavour,
    so this build makes no network requests of its own.

    The PRoot runtime is compiled during the build by
    term-ubuntu/tools/build-proot.sh from sources in the repository:
    third_party/proot (termux/proot, tag v5.1.107.92) and
    third_party/libandroid-shmem (termux/libandroid-shmem, tag v0.7) as
    submodules, plus talloc 2.4.3's talloc.c and talloc.h vendored verbatim
    because talloc has no git upstream. The script verifies both submodule
    commits, downloads nothing, applies one documented patch from
    term-ubuntu/patches, and asserts the link contract and 16 KB page alignment
    of everything it produces. submodules: true is therefore required.

    PRoot is GPL-2.0 and talloc is LGPL-3.0; the corresponding source for the
    distributed binaries is the pinned submodule, the patch and the build
    script, all carried by the tag.

AutoUpdateMode: None
UpdateCheckMode: Tags ^ubuntu-v[0-9.]+$
CurrentVersion: 0.1.0
CurrentVersionCode: 100
