# Candidate fdroiddata metadata for ThothTerm Ubuntu.
#
# This is the repository's reference copy. The file that is actually submitted
# lives in fdroiddata as metadata/com.thothterm.ubuntu.yml; the only difference
# is that the submitted copy pins `commit:` to the full commit hash that the
# tag below resolves to, rather than to the tag name.
#
# Reviewer note: the fdroid flavour ships no distribution binaries. The Ubuntu
# userland is downloaded on first run, only after an explicit opt-in, from a URL
# and SHA-256 that are fixed in this app's source. See docs/FDROID_READINESS.md.

# AntiFeatures: none declared, deliberately.
#
# NonFreeNet means the app depends on a non-free network service. Canonical's
# Ubuntu archive is not one: what is downloaded is free software, served from
# the distribution's own mirror, pinned to one release and checksum-verified
# before use. The closest precedents on F-Droid -- UserLAnd and Termux, which
# both fetch distribution payloads after installation -- declare no
# AntiFeatures either.
#
# If a reviewer would still prefer one, we are happy to add it; the consented
# download is described under MaintainerNotes and in docs/FDROID_READINESS.md.

