MaintainerNotes: |-
  ThothTerm • ThothDock is the product name of this package (com.thothterm.debian). It is an
  independent app that runs a Debian GNU/Linux 13 (trixie) environment under
  PRoot, and ThothDock, a Docker-compatible userspace engine. It is not
  affiliated with or endorsed by the Debian Project; "Debian" and "Trixie" only
  describe the guest distribution. arm64-v8a only, minSdk 26. A separate app
  from ThothTerm Ubuntu (com.thothterm.ubuntu); shared code lives in
  garden-common/. Tags keep the trixie-v* family, so updates keep working.

  The fdroid flavour packages no distribution binaries. On first run the app
  downloads the Debian rootfs only after an explicit opt-in, from the project's
  release debian-rootfs-trixie-arm64-f6520ff1c6ee, and refuses it unless size
  and SHA-256 match garden-debian/src/main/assets/garden/distro.properties
  (62445701 bytes, f6520ff1c6eeb28ead2d175e6733da4c970459a291b1bd60f992f1655c5d0677).
  It is built reproducibly from snapshot.debian.org by
  garden-debian/rootfs/build-rootfs.sh (docs/garden/debian/ROOTFS_PROVENANCE.md).

  PRoot is compiled during the build by garden-common/tools/build-proot.sh from
  submodules third_party/proot (termux/proot v5.1.107.92) and
  third_party/libandroid-shmem (v0.7), eight patches in garden-common/patches
  and talloc 2.4.3 vendored verbatim; nothing is downloaded and 16 KB page
  alignment is checked. PRoot is GPL-2.0, talloc LGPL-3.0.

  ThothDock is a Docker Engine API 1.41 userspace engine (owner-only Unix
  socket) so the unmodified Docker CLI works in the terminal. No dockerd,
  containerd or runc is shipped. Both programs are built from source from
  submodules pinned in the tagged commit, nothing downloaded:
  third_party/thothdock (Lord1Egypt/ThothDock v0.1.1, Apache-2.0,
  golang.org/x/sys vendored) and third_party/docker-cli (docker/cli v29.8.1,
  commit 4a63305d, Apache-2.0, unmodified, own vendor/ tree, client only), by
  garden-common/tools/stage-thothdock.sh into libthothdock.so and libdocker.so.
  Provenance of every native file: THIRD_PARTY_NOTICES.md 1.3 and 1.6.

  Go 1.26 is required by docker/cli. Trixie has Go 1.24.4 and Go 1.26 needs a
  1.24.6 bootstrap, so the recipe builds Go 1.24.6 then 1.26.8 from the go
  srclib with make.bash (Debian golang-go is only the first bootstrap) and points
  Gradle at it with -PthothtermGoRoot written to gradle.properties. GOTOOLCHAIN
  is local; no Go module is fetched.

  Scanner: the Docker CLI source tree carries two UTF-16 text fixtures,
  third_party/docker-cli/cli/command/container/testdata/utf16.env and
  utf16be.env. They are test data of the upstream CLI, not compiled and not
  packaged, so exactly these two files are removed with scandelete before the
  scan; no directory is ignored.

  Container images are fetched only when the user runs docker pull or docker
  run (HTTPS, digest-verified); never in the background. Pulls are bounded by
  explicit layer, size and free-storage ceilings.

  LAN Mode is an off-by-default HTTP/WebSocket server for using the terminal
  from a browser on the same LAN after PIN pairing; it serves only assets
  packaged in the APK (xterm.js built unminified from npm packages pinned by
  sha512; the Gradle build does not run Node).

  Release builds are minified with proguard-android-optimize.txt plus
  garden-common/consumer-rules.pro (two keep rules: the native library
  registers methods by the literal class names com/thothterm/TermIO$Native and
  com/thothterm/Process$Native). The unsigned release APK is byte-identical
  across a local build, GitHub Actions and this recipe on the buildserver.
  Reproducible Builds is enabled: the upstream APK is that unsigned build signed
  with apksigner (v2+v3, alignment preserved) using the dedicated Trixie key
  (certificate SHA-256 in AllowedAPKSigningKeys); the private key is never
  shared with F-Droid.

