Builds:
  - versionName: 0.3.1
    versionCode: 301
    commit: trixie-v0.3.1
    subdir: garden-debian
    submodules: true
    scandelete:
      - third_party/docker-cli/cli/command/container/testdata/utf16.env
      - third_party/docker-cli/cli/command/container/testdata/utf16be.env
    sudo:
      - apt-get update
      - apt-get install -y golang-go
    gradle:
      - fdroid
    srclibs:
      - go@go1.26.8
    build:
      - git -C $$go$$ checkout -qf go1.24.6
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - cp -a $$go$$ $HOME/go-bootstrap
      - git -C $$go$$ clean -qfdx
      - git -C $$go$$ checkout -qf go1.26.8
      - pushd $$go$$/src
      - GOROOT_BOOTSTRAP=$HOME/go-bootstrap ./make.bash
      - popd
      - echo "thothtermGoRoot=$$go$$" >> ../gradle.properties
    ndk: 23.2.8568313

