# ThothTerm Security -- the Garden edition's data. garden-common reads this file
# and holds no distribution knowledge of its own.
#
# The base system is the Arch Linux ARM userland ThothTerm Rolling ships: the
# same immutable archive, built by garden-arch/rootfs/build-rootfs.sh (see
# docs/garden/security/ROOTFS_PROVENANCE.md). It contains no third-party
# security repository, no BlackArch package and no BlackArch keyring: the
# optional repository below is fetched at run time, only after the user agrees.
editionName=ThothTerm Security
distroName=Arch Linux ARM
distroVersion=AArch64 (packages as of 2026-09-30)
distroDir=security-aarch64

imageId=arch-aarch64-03a4c669ed6f
architecture=aarch64
# The fdroid flavour downloads exactly this file after explicit consent and
# refuses it unless both the size and the SHA-256 below match. The full
# flavour's build refuses to embed anything else.
sourceUrl=https://github.com/Lord1Egypt/AndroidThothTerm/releases/download/arch-rootfs-aarch64-03a4c669ed6f/thothterm-arch-aarch64-rootfs-03a4c669ed6f.tar.gz
# Embedded as .tgz: the asset packager would expand a *.gz asset.
assetName=thothterm-arch-aarch64-rootfs-03a4c669ed6f.tgz
sha256=03a4c669ed6f89d044a9e83dce54c554f04885fd1bb7d1793f5b95b7cc0f48d1
compressedSize=199826020
uncompressedSize=674723840
# Bumped when the managed guest configuration must be re-applied.
schemaVersion=1

# Ubuntu 7681, Trixie 7682, Rolling 7683: docs/garden/PORTS.md.
lanPort=7684
sudoBinary=usr/bin/sudo

# pacman, as in Rolling: the app creates this installation's own pacman keyring
# at first run and proves it against the Arch Linux ARM package-signing key
# before setup completes. Arch Linux ARM Build System <builder@archlinuxarm.org>,
# as published on https://archlinuxarm.org/about/package-signing
packageManager=pacman
adminGroup=wheel
pacmanKeyring=archlinuxarm
packageSigningKey=68B3537F39A313B3E574D06777193F152BDBE6A6

# ---- optional third-party repository: the BlackArch aarch64 repository ----------
# A factual interoperability feature, off until the user chooses "Enable" on the
# consent screen. Nothing of it is in this APK or in the rootfs. The app then
# downloads the repository's keyring package and its signature from the
# project's own site over HTTPS, accepts exactly the artifact pinned here
# (blackarch-keyring 20251011-2: size and SHA-256 of the package and of its
# detached signature), proves in the guest that the keyring trusts exactly the
# fingerprints below and keeps the revoked one revoked, installs it with pacman
# (LocalFileSigLevel = Required) and adds one [blackarch] section. No script
# from the network is run, no SigLevel is lowered. Verified against the live
# repository on 2026-10-04 (docs/garden/security/DESIGN.md); the
# repository keeps only its latest keyring, so a new upstream release makes the
# download fail closed until this release pin is reviewed and updated.
extraRepo=blackarch
extraRepoLabel=BlackArch repository
extraRepoSite=https://blackarch.org
extraRepoServer=https://blackarch.org/blackarch/$repo/os/$arch
# Also the package name prefix: blackarch-keyring.
extraRepoKeyring=blackarch
extraRepoKeyringUrl=https://blackarch.org/blackarch/blackarch/os/aarch64/blackarch-keyring-20251011-2-any.pkg.tar.zst
extraRepoKeyringSize=18445
extraRepoKeyringSha256=d40c1301f84195164a2843f2447f5b3833bd9ea30e5cfdaf4271ad9c9771ee07
extraRepoKeyringSigUrl=https://blackarch.org/blackarch/blackarch/os/aarch64/blackarch-keyring-20251011-2-any.pkg.tar.zst.sig
extraRepoKeyringSigSize=566
extraRepoKeyringSigSha256=c2e21fcd878e26ed0b91ebc53f5fbb3d9a5d28278f0eb218ea866b7a2c04499d
# The four keys blackarch-keyring's blackarch-trusted lists (the same four the
# project's strap.sh lists), and the one it revokes.
extraRepoTrusted=4345771566D76038C7FEB43863EC0ADBEA87E4E3 8F9A9793CB8591147C2EC70566E0CDBD1E01F333 A0917C4147A37007CB54C1CFD295AA940EFDDF62 F9A6E68A711354D84A9B91637533BAFE69A25079
extraRepoRevoked=5E210889BBB5C48500E0C4F9C75E985FF8B993B4
# Levon 'noptrix' Kayan: signed the keyring package and the repository.
extraRepoSigner=F9A6E68A711354D84A9B91637533BAFE69A25079
