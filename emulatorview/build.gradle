plugins {
    id 'com.android.library'
    id 'maven-publish'
}
// No Java toolchain is requested on purpose. Each module already fixes the
// Java level it compiles to through compileOptions, so the toolchain only
// chose which JDK ran javac -- and pinning it to 17 made the build
// unsatisfiable on build servers that ship a newer JDK and cannot provision
// an older one. Debian trixie, which F-Droid builds on, carries no JDK 17 at
// all. The build now runs on whatever JDK the environment provides.

android {
    namespace = "jackpal.androidterm.emulatorview"

    enableKotlin = false

    compileSdk = rootProject.ext.compileSdk
    buildToolsVersion = rootProject.ext.buildToolsVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
    }
    lint {
        targetSdk = rootProject.ext.targetSdkVersion
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        targetSdk = rootProject.ext.targetSdkVersion
        unitTests.returnDefaultValues = true
    }
    productFlavors {
    }
    buildTypes {
        release {
            minifyEnabled = false
            // use default file with automatically generated optimization rules/R8 optimizer
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
    publishing {
        singleVariant('release') {}
    }
}

dependencies {
    implementation libs.annotation
    testImplementation 'junit:junit:4.13.2'
}

apply from: 'libVersion.gradle'
publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.thothterm'
            artifactId = 'emulatorview'
            version = project.ext.emulatorViewVersion
            pom {
                name = 'Emulator View'
                description = 'A terminal emulator library for Android OS'
                url = 'https://github.com/Lord1Egypt/AndroidThothTerm'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                packaging = 'aar'
                scm {
                    url = 'https://github.com/Lord1Egypt/AndroidThothTerm/tree/master/emulatorview'
                }
            }
            afterEvaluate {
                from components.release
            }
        }
    }
}
